<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Complaint Tracker</title>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/main.css" />
</head>
<body>
    <header class="app-header">
        <div class="logo-container">
            <i class="fas fa-exclamation-circle logo-icon"></i>
            <span class="logo-text">Complaint Tracker</span>
        </div>
        <div class="header-actions">
            <button id="logout-btn" class="logout-button"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </header>

    <main class="dashboard-container">
        <h1 class="dashboard-title">Dashboard</h1>

        <section class="stat-cards">
            <div class="stat-card">
                <span class="stat-title">Total Complaints</span>
                <span id="total-complaints" class="stat-value">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-title high-priority-text">High Priority</span>
                <span id="high-priority-complaints" class="stat-value">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-title medium-priority-text">Medium Priority</span>
                <span id="medium-priority-complaints" class="stat-value">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-title low-priority-text">Low Priority</span>
                <span id="low-priority-complaints" class="stat-value">0</span>
            </div>
        </section>

        <section class="dashboard-main-content">
            <div class="dashboard-left">
                <div class="complaint-form-card">
                    <h2>File a New Complaint</h2>
                    <form id="complaint-form">
                        <input type="hidden" id="complaintId" />
                        <div class="form-group">
                            <label for="title">Title</label>
                            <input type="text" id="title" placeholder="Enter complaint title" required />
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" placeholder="Describe your complaint" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="department">Department</label>
                            <select id="department" required>
                                <option value="" disabled selected>Select department</option>
                                <option value="Maintenance">Maintenance</option>
                                <option value="Security">Security</option>
                                <option value="IT Support">IT Support</option>
                                <option value="Front Desk">Front Desk</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="priority">Priority</label>
                            <select id="priority" required>
                                <option value="" disabled selected>Select priority</option>
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>
                        <button type="submit"><i class="fas fa-paper-plane"></i> Submit Complaint</button>
                    </form>
                </div>
            </div>

            <div class="dashboard-right">
                <div class="complaint-list-card">
                    <h2>Submitted Complaints</h2>
                    <table class="complaint-table">
                        <thead>
                            <tr>
                                <th>TITLE</th>
                                <th>DEPARTMENT</th>
                                <th>PRIORITY</th>
                                <th>STATUS</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="complaint-list">
                            <!-- Rows will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>

    <!-- Modals (can be kept for functionality) -->
    <div id="confirmation-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Confirm Deletion</h2>
            <p>Are you sure you want to delete this complaint?</p>
            <div class="modal-actions">
                <button id="confirm-delete-btn" class="btn-danger">Delete</button>
                <button id="cancel-delete-btn" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>
    <div id="info-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 id="info-modal-title"></h2>
            <p id="info-modal-message"></p>
            <div class="modal-actions">
                <button id="info-modal-ok-btn" class="btn-secondary">OK</button>
            </div>
        </div>
    </div>
</body>
</html>
