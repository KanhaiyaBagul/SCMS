<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account | Complaint Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="app-header">
        <div class="logo-container">
            <i class="fas fa-exclamation-circle logo-icon"></i>
            <span class="logo-text">Complaint Tracker</span>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Create your account</h1>
            <p class="auth-subtitle">And start managing complaints efficiently.</p>

            <form id="registerForm" class="auth-form">
                <input type="text" id="username" name="username" placeholder="Username" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_]+" title="Letters, numbers, and underscores only">
                <input type="email" id="email" name="email" placeholder="Email address" required>
                <input type="password" id="password" name="password" placeholder="Password" required minlength="6">
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
                <button type="submit" id="registerBtn">Register</button>
            </form>

            <div id="message" class="message"></div>
            <p class="auth-link">Already have an account? <a href="/index.html">Login here</a></p>
        </div>
    </main>

    <script>
        // The existing script remains the same for functionality.
        document.getElementById("registerForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const registerBtn = document.getElementById("registerBtn");
            const messageEl = document.getElementById("message");

            messageEl.textContent = "";
            messageEl.className = "message";
            registerBtn.disabled = true;

            if (document.getElementById("password").value !== document.getElementById("confirmPassword").value) {
                messageEl.textContent = "Passwords don't match!";
                messageEl.classList.add("error");
                registerBtn.disabled = false;
                return;
            }

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        username: this.username.value,
                        email: this.email.value,
                        password: this.password.value
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    messageEl.textContent = "Registration successful! Redirecting to login...";
                    messageEl.classList.add("success");
                    setTimeout(() => window.location.replace("/index.html"), 1500);

                } else {
                    messageEl.textContent = result.error || "Registration failed";
                    messageEl.classList.add("error");
                }
            } catch (error) {
                console.error("Registration error:", error);
                messageEl.textContent = "An unexpected error occurred. Please try again.";
                messageEl.classList.add("error");
            } finally {
                registerBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
